services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finbpo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finbpo}
      POSTGRES_DB: finbpo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbpo"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://finbpo:${POSTGRES_PASSWORD:-finbpo}@db:5432/finbpo
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no arquivo .env}
      CORS_ORIGINS: '["http://localhost:8080"]'
      MCP_TOKEN: ${MCP_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
